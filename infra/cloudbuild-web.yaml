# Cloud Build: web Docker 이미지 빌드 (모노레포 루트 컨텍스트, apps/web/Dockerfile 사용).
# substitution: _API_URL = NEXT_PUBLIC_API_URL (백엔드 Cloud Run URL).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -f
      - apps/web/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/sizl-beta-web:latest
      - .
images:
  - gcr.io/$PROJECT_ID/sizl-beta-web:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
